<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ERP Login</title>
  <link rel="stylesheet" href="/src/css/main.css" />
</head>

<body class="min-h-screen flex items-center justify-center bg-slate-100">
  <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm">
    <h1 class="text-2xl font-bold mb-6 text-center text-slate-800">ERP Login</h1>
    <form id="loginForm" class="space-y-4">
      <input id="username" type="text" placeholder="Username" required value="admin"
        class="w-full px-3 py-2 border border-slate-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" />
      <input id="password" type="password" placeholder="Password" required value="admin123"
        class="w-full px-3 py-2 border border-slate-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" />
      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 font-medium">
        Sign In
      </button>
      <!-- Add this right below the submit button inside the form -->
      <p class="text-center text-sm text-slate-600 mt-4">
        Don't have an account? <a href="/pages/signup/signup.html" class="text-blue-600 hover:underline">Sign up</a>
      </p>
      <section class="mt-5 rounded-lg bg-slate-50 p-4 text-center">
        <h2 id="greeting" class="font-semibold text-slate-800"></h2>
        <p id="currentDateTime" class="mt-1 text-sm text-slate-500"></p>
      </section>
      <p id="error" class="text-red-600 text-sm hidden text-center"></p>
    </form>
    <div class="mt-6 text-xs text-slate-500 text-center space-y-1">
      <p><b>admin / admin123</b> — full access</p>
      <p><b>sales / sales123</b> — customers</p>
      <p><b>accounting / accounting123</b> — accounting</p>
      <p><b>marketing / marketing123</b> — marketing</p>
    </div>
  </div>
  <script type="module" src="/src/js/login.js"></script>
</body>

</html>
