<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ERP Login</title>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
  <div class="w-full max-w-sm space-y-4">
    <form id="login-form" class="bg-white p-8 rounded-xl shadow space-y-4">
      <div>
        <h1 class="text-2xl font-bold text-slate-800">ERP System</h1>
        <p class="text-sm text-slate-500">Sign in to your department</p>
      </div>
      <input name="email" type="email" placeholder="Email" required autocomplete="username"
             class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      <input name="password" type="password" placeholder="Password" required autocomplete="current-password"
             class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      <p id="error" class="text-sm text-red-600 min-h-[1.25rem]"></p>
      <button class="w-full bg-indigo-600 text-white rounded-lg py-2 font-medium hover:bg-indigo-700">Login</button>
    </form>

    <div class="bg-white p-4 rounded-xl shadow text-sm">
      <p class="font-medium text-slate-700 mb-2">Demo accounts (click to fill)</p>
      <div id="demo" class="grid grid-cols-2 gap-2"></div>
    </div>
  </div>
  <script type="module" src="/src/js/login.js"></script>
</body>
</html>
