<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leave management | TaskMatrix</title>
  <link rel="stylesheet" href="/src/css/main.css" />
</head>

<body class="app-body">
  <div id="topbar"></div>
  <main class="app-main">
    <div class="page-container">
      <header class="page-header">
        <div>
          <div class="page-eyebrow">People operations</div>
          <h1 class="page-title">Leave management</h1>
          <p class="page-description">Submit leave requests and review their current status.</p>
        </div>
      </header>

      <section class="surface-card mb-6">
        <div class="panel-heading">
          <div>
            <h2 class="panel-title">Apply for leave</h2>
            <div class="panel-subtitle">Provide the details for your leave request</div>
          </div>
        </div>
        <div class="panel-body">
          <form id="leaveForm" class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <label class="sr-only" for="type">Leave type</label>
            <select id="type" required>
              <option value="" disabled selected>Select leave type</option>
              <option value="Sick">Sick Leave</option>
              <option value="Vacation">Vacation</option>
              <option value="Personal">Personal</option>
              <option value="Other">Other</option>
            </select>
            <label class="sr-only" for="start_date">Start date</label>
            <input type="date" id="start_date" required />
            <label class="sr-only" for="end_date">End date</label>
            <input type="date" id="end_date" required />
            <label class="sr-only" for="reason">Reason</label>
            <input type="text" id="reason" placeholder="Reason for leave" required />
            <button type="submit" class="md:col-span-2 primary-button py-2">Submit application</button>
          </form>
          <p id="msg" class="text-sm mt-2" role="status"></p>
        </div>
      </section>

      <section class="surface-card overflow-hidden">
        <div class="panel-heading">
          <div>
            <h2 class="panel-title">Leave requests</h2>
            <div class="panel-subtitle">Requests associated with your account and role</div>
          </div>
        </div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>Employee</th><th>Type</th><th>Dates</th><th>Status</th>
                <th id="adminActionHeader" style="display:none;">Action</th>
              </tr>
            </thead>
            <tbody id="leaveTable"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
  <script type="module" src="/src/js/leave.js"></script>
</body>

</html>
