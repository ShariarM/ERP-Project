<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leave Management</title>
  <link rel="stylesheet" href="/src/css/main.css" />
</head>
<body class="min-h-screen bg-slate-100">
  <div id="topbar"></div>
  <main class="ml-64 p-8 min-h-screen bg-slate-100">
    <h1 class="text-2xl font-bold mb-6 text-slate-800">Leave Management</h1>

    <div class="bg-white p-6 rounded-lg shadow mb-8">
      <h2 class="font-bold text-lg mb-4 text-slate-700">Apply for Leave</h2>
      <form id="leaveForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <select id="type" required class="px-3 py-2 border rounded">
          <option value="" disabled selected>Select Leave Type</option>
          <option value="Sick">Sick Leave</option>
          <option value="Vacation">Vacation</option>
          <option value="Personal">Personal</option>
          <option value="Other">Other</option>
        </select>
        <input type="date" id="start_date" required class="px-3 py-2 border rounded" />
        <input type="date" id="end_date" required class="px-3 py-2 border rounded" />
        <input type="text" id="reason" placeholder="Reason for leave" required class="px-3 py-2 border rounded" />
        <button class="md:col-span-2 bg-blue-600 text-white py-2 rounded hover:bg-blue-700 font-medium">Submit Application</button>
      </form>
      <p id="msg" class="text-sm mt-2"></p>
    </div>

    <div class="bg-white rounded-lg shadow overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-slate-200 text-slate-700">
          <tr>
            <th class="text-left p-3">Employee</th>
            <th class="text-left p-3">Type</th>
            <th class="text-left p-3">Dates</th>
            <th class="text-left p-3">Status</th>
            <th class="text-left p-3" id="adminActionHeader" style="display:none;">Action</th>
          </tr>
        </thead>
        <tbody id="leaveTable"></tbody>
      </table>
    </div>
  </main>
  <script type="module" src="/src/js/leave.js"></script>
</body>
</html>
