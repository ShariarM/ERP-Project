<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marketing | TaskMatrix</title>
  <link rel="stylesheet" href="/src/css/main.css" />
</head>

<body class="app-body">
  <div id="topbar"></div>
  <main class="app-main">
    <div class="page-container">
      <header class="page-header">
        <div>
          <div class="page-eyebrow">Business management</div>
          <h1 class="page-title">Marketing</h1>
          <p class="page-description">Review your available customer outreach base.</p>
        </div>
      </header>

      <section class="surface-card mb-5">
        <div class="panel-body">
          <div class="page-eyebrow">Campaign management</div>
          <h2 class="panel-title text-lg">Plan your next campaign</h2>
          <p class="page-description mb-5">Use this page to manage marketing campaigns and view customer outreach lists.</p>
          <button type="button" class="primary-button px-4 py-2">Create new campaign</button>
        </div>
      </section>

      <section class="surface-card metric-card">
        <div class="metric-label">Customer base</div>
        <div class="metric-value" id="customerCount">0</div>
        <div class="metric-note">Total customers available for marketing outreach.</div>
      </section>
    </div>
  </main>
  <script type="module" src="/src/js/marketing.js"></script>
</body>

</html>
