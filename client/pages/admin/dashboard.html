<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="/src/css/main.css" />
</head>

<body class="min-h-screen bg-slate-100">
  <div id="topbar"></div>
  <!-- ml-64 keeps the content to the right of the fixed sidebar -->
  <main class="ml-64 p-8 min-h-screen bg-slate-100">
    <div class="p-6 max-w-6xl mx-auto">
      <h1 class="text-2xl font-bold mb-6 text-slate-800">Admin Dashboard</h1>
      <p id="err" class="text-red-600 mb-4"></p>
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div class="bg-white p-4 rounded-lg shadow">
          <div class="text-sm text-slate-500">Total Sales</div>
          <div id="totalSales" class="text-2xl font-bold">$0</div>
        </div>
        <div class="bg-white p-4 rounded-lg shadow">
          <div class="text-sm text-slate-500">Sales Count</div>
          <div id="salesCount" class="text-2xl font-bold">0</div>
        </div>
        <div class="bg-white p-4 rounded-lg shadow">
          <div class="text-sm text-slate-500">Avg Sale</div>
          <div id="avgSale" class="text-2xl font-bold">$0</div>
        </div>
        <div class="bg-white p-4 rounded-lg shadow">
          <div class="text-sm text-slate-500">Customers</div>
          <div id="customerCount" class="text-2xl font-bold">0</div>
        </div>
      </div>

      <div class="bg-white rounded-lg shadow mt-6 overflow-hidden">
        <div class="flex items-center justify-between p-4 border-b">
          <h2 class="font-semibold text-slate-700">Team Activity</h2>
          <span id="onlineSummary" class="text-sm text-slate-500">Loading...</span>
        </div>
        <p id="activeErr" class="text-red-600 text-sm px-4 pt-3 empty:hidden"></p>
        <table class="w-full text-sm">
          <thead class="bg-slate-200 text-slate-700">
            <tr>
              <th class="text-left p-3">User</th>
              <th class="text-left p-3">Department</th>
              <th class="text-left p-3">Status</th>
              <th class="text-left p-3">Last seen</th>
            </tr>
          </thead>
          <tbody id="activeTable"></tbody>
        </table>
      </div>
    </div>
  </main>
  <script type="module" src="/src/js/admin.js"></script>
</body>

</html>
