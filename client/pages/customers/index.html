<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customers | TaskMatrix</title>
  <link rel="stylesheet" href="/src/css/main.css" />
</head>

<body class="app-body">
  <div id="topbar"></div>
  <main class="app-main">
    <div class="page-container">
      <header class="page-header">
        <div>
          <div class="page-eyebrow">Business management</div>
          <h1 class="page-title">Customers</h1>
          <p class="page-description">Manage customer contact details and account records.</p>
        </div>
      </header>

      <section class="surface-card mb-6">
        <div class="panel-heading">
          <div>
            <h2 class="panel-title">Add or edit customer</h2>
            <div class="panel-subtitle">Customer information and contact details</div>
          </div>
        </div>
        <div class="panel-body">
          <form id="customerForm" class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <input type="hidden" id="id" />
            <label class="sr-only" for="name">Name</label>
            <input id="name" placeholder="Name *" required />
            <label class="sr-only" for="email">Email</label>
            <input id="email" type="email" placeholder="Email address" />
            <label class="sr-only" for="phone">Phone</label>
            <input id="phone" placeholder="Phone number" />
            <label class="sr-only" for="address">Address</label>
            <input id="address" placeholder="Address" />
            <div class="md:col-span-2 flex gap-2 pt-1">
              <button type="submit" class="primary-button px-4 py-2">Save customer</button>
              <button type="button" id="resetBtn" class="secondary-button px-4 py-2">Reset</button>
            </div>
          </form>
          <p id="err" class="text-red-600 mt-2 text-sm" role="status"></p>
        </div>
      </section>

      <section class="surface-card overflow-hidden">
        <div class="panel-heading">
          <div>
            <h2 class="panel-title">Customer directory</h2>
            <div class="panel-subtitle">Customer records available in your workspace</div>
          </div>
        </div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Address</th><th>Actions</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
  <script type="module" src="/src/js/customers.js"></script>
</body>

</html>
